name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"
      - run: gradle build --stacktrace
      - name: Publish the Fabric release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=minecraft-1.21.1-fabric
          git tag -f "$tag"
          git push origin "refs/tags/$tag" --force
          jar=$(find build/libs -name 'curios-fabric-1.21.1-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$jar"
          name=$(basename "$jar")
          zip -j all-jars.zip "$jar"
          notes="Fabric 1.21.1 port of the Curios API. Datapacks and item tags match Curios 9.5.1. This is not a connector. It is not published to Modrinth or Mikchan CDN."
          if gh release view "$tag" >/dev/null 2>&1; then
            while read -r asset; do
              case "$asset" in
                curios-fabric-1.21.1-*.jar)
                  if [[ "$asset" != "$name" ]]; then
                    gh release delete-asset "$tag" "$asset" --yes
                  fi
                  ;;
              esac
            done < <(gh release view "$tag" --json assets --jq '.assets[].name')
            gh release upload "$tag" "$jar" all-jars.zip --clobber
            gh release edit "$tag" --title "curios api for minecraft 1.21.1 fabric" --notes "$notes"
          else
            gh release create "$tag" "$jar" all-jars.zip \
              --title "curios api for minecraft 1.21.1 fabric" \
              --notes "$notes"
          fi
