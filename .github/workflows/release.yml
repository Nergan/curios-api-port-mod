name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"
      - run: gradle build --stacktrace
      - name: Publish the Fabric release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=minecraft-1.21.1-fabric
          git tag -f "$tag"
          git push origin "refs/tags/$tag" --force
          jar=$(find build/libs -name 'curios-fabric-1.21.1-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$jar"
          name=$(basename "$jar")
          zip -j all-jars.zip "$jar"
          notes="Fabric 1.21.1 port of the Curios API. Datapacks and item tags match Curios 9.5.1. This is not a connector. The same jar is McnCDN package curios-api-port-mod. It is not published to Modrinth."
          if gh release view "$tag" >/dev/null 2>&1; then
            while read -r asset; do
              case "$asset" in
                curios-fabric-1.21.1-*.jar)
                  if [[ "$asset" != "$name" ]]; then
                    gh release delete-asset "$tag" "$asset" --yes
                  fi
                  ;;
              esac
            done < <(gh release view "$tag" --json assets --jq '.assets[].name')
            gh release upload "$tag" "$jar" all-jars.zip --clobber
            gh release edit "$tag" --title "curios api for minecraft 1.21.1 fabric" --notes "$notes"
          else
            gh release create "$tag" "$jar" all-jars.zip \
              --title "curios api for minecraft 1.21.1 fabric" \
              --notes "$notes"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish the jar to McnCDN
        env:
          MCNS_WORKER_TOKEN: ${{ secrets.MCNS_WORKER_TOKEN }}
          MCNS_WORKER_ID: ${{ secrets.MCNS_WORKER_ID }}
          MCNS_WORKER_KEY: ${{ secrets.MCNS_WORKER_KEY }}
          MCNS_MOD_VERSION: "1.0.2"
          MCNS_COMMIT: ${{ github.sha }}
          MCNS_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import pathlib; print([line.split('=',1)[1].strip() for line in pathlib.Path('gradle.properties').read_text().splitlines() if line.startswith('mod_version=')][0])")
          jar=$(find build/libs -name 'curios-fabric-1.21.1-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          code=$(curl -sS -o /dev/null -w "%{http_code}" "https://cdn.mikchan.net/v1/packages/curios-api-port-mod/versions/${version}")
          if [[ "$code" == "200" ]]; then
            echo "McnCDN curios-api-port-mod@${version} is already published."
            exit 0
          fi
          if [[ -z "${MCNS_WORKER_TOKEN}" && ( -z "${MCNS_WORKER_ID}" || -z "${MCNS_WORKER_KEY}" ) ]]; then
            echo "McnCDN credentials are not configured on this repository." >&2
            exit 1
          fi
          node scripts/mcns-ensure-package.mjs curios-api-port-mod jar "Curios API Fabric" "curios-fabric-1.21.1-[version].jar"
          node scripts/mcns-release.mjs curios-api-port-mod "$version" "jar=${jar}"
