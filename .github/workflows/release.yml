name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"
      - run: gradle build --stacktrace
      - name: Publish the Fabric release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=minecraft-1.21.1-fabric
          git tag -f "$tag"
          git push origin "refs/tags/$tag" --force
          jar=$(find build/libs -name 'curios-fabric-1.21.1-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          zip -j all-jars.zip "$jar"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$jar" all-jars.zip --clobber
          else
            gh release create "$tag" "$jar" all-jars.zip \
              --title "curios api for minecraft 1.21.1 fabric" \
              --notes "Fabric 1.21.1 port of the Curios API. Datapacks and item tags match Curios 9.5.1. This is not a connector. It is not published to McnCDN or Modrinth."
          fi
